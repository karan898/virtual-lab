# docker-compose.yml — Virtual Networking Lab stack
# Run: docker compose --env-file .env up -d
#
# Services: postgres, redis, kafka (KRaft), backend, frontend, prometheus
# Optional (profile=dashboards): grafana
#
# The backend reaches the kind cluster via mounted kubeconfig.

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.3-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [netlab]

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2.5-alpine3.20
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""

    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [netlab]

  # ── Apache Kafka 3.7 (KRaft mode — no ZooKeeper) ─────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      # KRaft mode: no ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Heap cap at 512 MB as required
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data

    deploy:
      resources:
        limits:
          memory: 600M       # 512MB JVM + 88MB overhead
        reservations:
          memory: 300M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [netlab]

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
      KUBECONFIG: "/home/netlab/.kube/config"
    volumes:
      # Mount kubeconfig so backend can reach the kind cluster
      # The kind cluster runs in WSL2; kubeconfig is at ~/.kube/config in WSL2
      # We use the kind-internal server address (kind-netlab container IP)
      - kind_kubeconfig:/home/netlab/.kube:ro
      - ./templates:/templates:ro
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - netlab
      - kind

  # ── Frontend (React SPA served by Nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    networks: [netlab]

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks: [netlab]

  # ── Grafana (OFF by default — use: docker compose --profile dashboards up) ─
  grafana:
    image: grafana/grafana:10.4.2
    profiles: ["dashboards"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_PORT: "3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks: [netlab]

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  # kind_kubeconfig is populated by 'make cluster' via:
  # docker run --rm -v kind_kubeconfig:/out kindest/node:... cp -r /root/.kube /out
  # Actually we use a bind mount from WSL2 ~/.kube — see Makefile
  kind_kubeconfig:
    external: true

# ── Network ────────────────────────────────────────────────────────────────
networks:
  kind:
    external: true
  netlab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24   # Distinct from kind's 172.20/21 subnets
